<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Highway Knuckles</title>
<meta name="description" content="A pixel-art arcade bike brawler. Five roads, seven rivals, no rules.">
<meta name="theme-color" content="#0d0a1a">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Knuckles">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<script>if(/\/knuckles$/.test(location.pathname))location.replace(location.pathname+'/'+location.search+location.hash);</script>
</head>
<body>
<style>
/* Layout: landscape arcade cabinet. Full-bleed pixel canvas; top strip for race info, bottom corners reserved for thumbs, centre band for big words. Menus are sparse pixel cards over the live road. */
@font-face{font-family:"Press Start 2P";src:url("./fonts/press-start-2p.woff2") format("woff2");font-display:swap}
:root{
  --ink:#0d0a1a;
  --panel:#16112b;
  --line:#3a3058;
  --cream:#f3ead8;
  --amber:#ffb000;
  --red:#ff3d4a;
  --cyan:#39d0e0;
  --mute:#9a90b8;
  --px:"Press Start 2P","Courier New",monospace;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden;margin:0}
body{background:var(--ink);color:var(--cream);font-family:var(--px);font-size:10px;line-height:1.6;padding-left:max(16px,var(--sal));padding-right:max(16px,var(--sar));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none;-webkit-touch-callout:none}
#app{position:fixed;inset:0;overflow:hidden;background:var(--ink)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
[hidden]{display:none!important}
img.px{image-rendering:pixelated}

/* thumbs */
#touch{position:absolute;inset:0;pointer-events:none}
#stickZone{position:absolute;left:0;bottom:0;width:44%;height:70%;pointer-events:auto;touch-action:none}
.stick{position:absolute;width:var(--sb,116px);height:var(--sb,116px);margin:calc(var(--sb,116px)/-2) 0 0 calc(var(--sb,116px)/-2);border-radius:50%;
  background:rgba(13,10,26,.4);box-shadow:inset 0 0 0 4px rgba(243,234,216,.3);pointer-events:none;transition:opacity .15s}
.stick.idle{opacity:.5}
.stick.max{box-shadow:inset 0 0 0 4px var(--amber)}
.stick.brake{box-shadow:inset 0 -6px 0 0 var(--amber),inset 0 0 0 4px rgba(243,234,216,.3)}
.stick i{position:absolute;left:50%;top:50%;width:42%;height:42%;margin:-21% 0 0 -21%;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ff9aa0 0 14%,#ff3d4a 15% 62%,#a0142a 63%);box-shadow:0 4px 0 #5a0a18}
.ab{position:absolute;border-radius:50%;pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center;
  background:var(--c);box-shadow:inset 0 -6px 0 rgba(0,0,0,.28),inset 0 4px 0 rgba(255,255,255,.22),0 6px 0 var(--d);transition:transform .05s,opacity .2s}
.ab img{width:44%;pointer-events:none}
.ab.on{transform:translateY(5px);box-shadow:inset 0 -3px 0 rgba(0,0,0,.28),inset 0 4px 0 rgba(255,255,255,.22),0 1px 0 var(--d)}
#bPunch{--c:#ff3d4a;--d:#8a1020}
#bKick{--c:#ffb000;--d:#8a5a00}
#bNitro{--c:#39d0e0;--d:#13707c;overflow:hidden}
#bNitro .fill{position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(13,10,26,0) var(--n,0%),rgba(13,10,26,.62) 0);pointer-events:none}
#bNitro.ready{animation:pulse .6s steps(2) infinite}
@keyframes pulse{50%{box-shadow:inset 0 -6px 0 rgba(0,0,0,.28),inset 0 4px 0 rgba(255,255,255,.22),0 6px 0 var(--d),0 0 0 4px var(--cream)}}
#wpn{position:absolute;pointer-events:none;font-size:8px;color:var(--cream);background:var(--ink);padding:3px 5px;white-space:nowrap;transform:translate(-50%,-100%)}
.off{opacity:.07!important;pointer-events:none!important}
#hand{position:absolute;width:44px;height:44px;pointer-events:none;image-rendering:pixelated;margin:-6px 0 0 -10px;filter:drop-shadow(0 3px 0 rgba(13,10,26,.7))}
#hand.tap{animation:tap .7s steps(2) infinite}
#hand.slide{animation:slide 1.4s steps(8) infinite alternate}
#hand.pull{animation:pull 1s steps(4) infinite}
#hand.hold{animation:none}
@keyframes tap{50%{transform:translateY(8px) scale(.92)}}
@keyframes slide{from{transform:translateX(-30px)}to{transform:translateX(30px)}}
@keyframes pull{from{transform:translateY(0)}to{transform:translateY(30px)}}

#bPause{position:absolute;right:max(16px,var(--sar));top:calc(var(--sat) + 10px);width:40px;height:40px;background:rgba(13,10,26,.6);box-shadow:0 0 0 3px var(--cream);font-size:11px}
#lesson{position:absolute;left:50%;top:calc(var(--sat) + 12px);transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:var(--ink);padding:10px 14px;box-shadow:0 0 0 3px var(--amber);white-space:nowrap;max-width:calc(100% - 140px)}
#lesson span{font-size:clamp(9px,1.6vw,12px);overflow:hidden;text-overflow:ellipsis}
#lesson b{font-weight:400;color:var(--amber)}
#lSkip{font-size:8px;color:var(--mute);padding:6px}

/* screens */
.screen{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;display:flex;flex-direction:column;align-items:center;justify-content:center;justify-content:safe center;gap:18px;text-align:center;
  padding:calc(var(--sat) + 14px) max(16px,var(--sar)) calc(var(--sab) + 14px) max(16px,var(--sal));
  background:radial-gradient(ellipse at center,rgba(13,10,26,.25),rgba(13,10,26,.82) 75%)}
.screen.solid{background:var(--ink)}
.logo{width:min(440px,70vw);image-rendering:pixelated;display:block}
.small{font-size:8px;color:var(--mute)}
.blink{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.bar{width:min(240px,50vw);height:8px;box-shadow:0 0 0 3px var(--cream);background:var(--ink);position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--amber)}
.big{font-size:clamp(28px,7vw,56px);line-height:1;margin:0;color:var(--amber);text-shadow:4px 4px 0 var(--red)}
.mid{font-size:clamp(11px,2vw,14px);margin:0}
.btn{font-size:13px;padding:14px 26px;background:var(--amber);color:var(--ink);box-shadow:0 6px 0 #8a5a00,0 0 0 3px var(--ink)}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #8a5a00,0 0 0 3px var(--ink)}
.btn.ghost{background:var(--panel);color:var(--cream);box-shadow:0 0 0 3px var(--cream)}
.btn.ghost:active{transform:translateY(2px)}
.icons{display:flex;gap:14px;justify-content:center}
.ic{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:7px;color:var(--mute);padding:4px}
.ic span.box{width:46px;height:46px;display:flex;align-items:center;justify-content:center;background:var(--panel);box-shadow:0 0 0 3px var(--line)}
.ic img{width:26px}
.ic:active span.box{box-shadow:0 0 0 3px var(--amber)}
.ic.dot span.box{box-shadow:0 0 0 3px var(--amber)}
#tTap{font-size:clamp(12px,2.2vw,16px);padding:14px 22px}
#tCorner{position:absolute;right:max(16px,var(--sar));bottom:calc(var(--sab) + 14px)}
#tCornerL{position:absolute;left:max(16px,var(--sal));bottom:calc(var(--sab) + 14px)}
#tLeft{position:absolute;left:max(16px,var(--sal));top:calc(var(--sat) + 14px);text-align:left;max-width:min(26vw,220px)}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chips .sep{width:8px}
.chips button{font-size:8px;padding:8px 10px;color:var(--mute);box-shadow:0 0 0 2px var(--line)}
.chips button[aria-pressed="true"]{color:var(--ink);background:var(--amber);box-shadow:0 0 0 2px var(--amber)}
.car{display:flex;align-items:center;gap:14px}
.car>button{font-size:18px;width:44px;height:64px;color:var(--cream)}
.car>button[disabled]{opacity:.2}
.card{display:flex;flex-direction:column;align-items:center;gap:10px;width:min(300px,52vw)}
.card canvas{width:100%;image-rendering:pixelated;box-shadow:0 0 0 3px var(--cream);display:block}
.card .nm{font-size:clamp(12px,2vw,15px)}
.card .meta{font-size:8px;color:var(--mute);min-height:1.6em}
.card .meta b{color:var(--amber);font-weight:400}
.row{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;width:min(640px,100%)}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--panel);padding:12px 8px;box-shadow:0 0 0 3px var(--line)}
.tile img{width:30px}
.tile .nm{font-size:9px}
.pips{display:flex;gap:3px}
.pips i{width:12px;height:6px;background:var(--line)}
.pips i.on{background:var(--amber)}
.tile button{font-size:9px;padding:8px 6px;width:100%;background:var(--amber);color:var(--ink)}
.tile button[disabled]{background:var(--line);color:var(--mute)}
.cash{color:var(--amber);font-size:11px}
.set{display:grid;grid-template-columns:auto auto;gap:14px 24px;align-items:center;text-align:left}
.tg{font-size:9px;padding:8px 12px;box-shadow:0 0 0 2px var(--line);color:var(--mute)}
.tg[aria-pressed="true"]{background:var(--amber);color:var(--ink);box-shadow:0 0 0 2px var(--amber)}
input[type=range]{accent-color:#ffb000;width:150px}
.rec{font-size:9px;color:var(--cream);margin:0}
#result{background:rgba(13,10,26,.8);gap:14px}
#result .icons{margin-top:4px}
@media (max-height:480px){.screen{gap:10px}#title .logo{width:min(440px,70vw,85vh)}.big{font-size:clamp(26px,11vh,48px)}#result{gap:9px}.btn{padding:11px 22px}.ic span.box{width:40px;height:40px}}
#rCash{font-size:clamp(14px,2.6vw,20px);color:var(--amber);margin:0}
#rotate{z-index:20;gap:22px}
#rotate img{width:72px;animation:rot 1.6s steps(1) infinite}
@keyframes rot{50%{transform:rotate(-90deg)}}
.tip{font-size:8px;color:var(--cream);background:var(--panel);box-shadow:0 0 0 2px var(--amber);padding:8px 10px;max-width:360px;line-height:1.8}
@media (prefers-reduced-motion:reduce){.blink,#bNitro.ready,#hand,#rotate img{animation:none}}
</style>

<div id="app">
  <canvas id="cv" aria-label="Race view"></canvas>

  <div id="touch" hidden>
    <div id="stickZone" aria-label="Steering stick"><div class="stick idle" id="stick"><i id="knob"></i></div></div>
    <button class="ab" id="bNitro" aria-label="Nitro, hold"><span class="fill"></span><img class="px" alt="" id="icNitro"></button>
    <button class="ab" id="bKick" aria-label="Kick"><img class="px" alt="" id="icKick"></button>
    <button class="ab" id="bPunch" aria-label="Punch"><img class="px" alt="" id="icPunch"></button>
    <span id="wpn" hidden></span>
    <img id="hand" class="px" alt="" hidden>
  </div>
  <button id="bPause" aria-label="Pause" hidden>II</button>
  <div id="lesson" hidden><span id="lText"></span><button id="lSkip">SKIP</button></div>

  <div class="screen solid" id="boot">
    <canvas class="logo" id="bootLogo"></canvas>
    <div class="bar"><i id="bootBar"></i></div>
  </div>

  <div class="screen" id="title" hidden>
    <canvas class="logo" id="titleLogo"></canvas>
    <button id="tTap" class="blink">TAP TO RIDE</button>
    <div class="chips" id="tDiff" role="group" aria-label="Difficulty"></div>
    <span class="small" id="tRoad">DUST BOWL · ROOKIE</span>
    <div id="tLeft"><span class="tip" id="tIos" hidden>FOR FULLSCREEN: TAP SHARE, THEN ADD TO HOME SCREEN</span><span class="small" id="tKeys" hidden>ARROWS STEER · Z PUNCH · X KICK · SHIFT NITRO</span></div>
    <div class="icons" id="tCornerL">
      <button class="ic" id="iRoads" aria-label="Roads"><span class="box"><img class="px" alt="" data-icon="road"></span>ROADS</button>
      <button class="ic" id="iGarage" aria-label="Garage"><span class="box"><img class="px" alt="" data-icon="wrench"></span>GARAGE</button>
    </div>
    <div class="icons" id="tCorner">
      <button class="ic" id="iSchool" aria-label="Riding school"><span class="box"><img class="px" alt="" data-icon="flag"></span>SCHOOL</button>
      <button class="ic" id="iSettings" aria-label="Settings"><span class="box"><img class="px" alt="" data-icon="gear"></span>SETUP</button>
    </div>
  </div>

  <div class="screen" id="select" hidden>
    <div class="chips" id="diffChips" role="group" aria-label="Difficulty"></div>
    <div class="car">
      <button id="cPrev" aria-label="Previous road">‹</button>
      <div class="card" id="card"><canvas id="cThumb" width="160" height="90"></canvas><span class="nm" id="cName"></span><span class="meta" id="cMeta"></span></div>
      <button id="cNext" aria-label="Next road">›</button>
    </div>
    <div class="row"><button class="btn ghost" id="sBack">BACK</button><button class="btn" id="sRide">RIDE</button></div>
  </div>

  <div class="screen" id="garage" hidden>
    <span class="cash" id="gCash">$0</span>
    <div class="tiles" id="tiles"></div>
    <button class="btn ghost" id="gDone">DONE</button>
  </div>

  <div class="screen" id="settings" hidden>
    <div class="set">
      <span>SOUND</span><button class="tg" id="oSound">ON</button>
      <span>VIBRATION</span><button class="tg" id="oBuzz">ON</button>
      <label for="oSens">STEERING</label><input type="range" id="oSens" min="60" max="140" step="5" value="100">
      <span>STICK SIZE</span><span class="chips"><button class="tg" data-size="96">S</button><button class="tg" data-size="116">M</button><button class="tg" data-size="140">L</button></span>
      <span>PROGRESS</span><button class="tg" id="oReset">RESET</button>
    </div>
    <button class="btn ghost" id="oDone">DONE</button>
  </div>

  <div class="screen" id="pause" hidden>
    <p class="big">PAUSED</p>
    <button class="btn" id="pResume">RESUME</button>
    <div class="row"><button class="btn ghost" id="pRestart">RESTART</button><button class="btn ghost" id="pHome">HOME</button><button class="btn ghost" id="pFull" hidden>FULLSCREEN</button></div>
  </div>

  <div class="screen" id="result" hidden>
    <p class="big" id="rPlace">1ST</p>
    <p class="mid" id="rGap"></p>
    <p id="rCash">+$0</p>
    <p class="rec blink" id="rRec" hidden>NEW RECORD</p>
    <button class="btn" id="rMain">RETRY</button>
    <div class="icons">
      <button class="ic" id="rHome" aria-label="Home"><span class="box"><img class="px" alt="" data-icon="home"></span>HOME</button>
      <button class="ic" id="rGarage" aria-label="Garage"><span class="box"><img class="px" alt="" data-icon="wrench"></span>GARAGE</button>
    </div>
  </div>

  <div class="screen solid" id="rotate" hidden>
    <img class="px" alt="" data-icon="phone">
    <p class="mid">TURN YOUR PHONE SIDEWAYS</p>
  </div>
</div>
<script>
/* Highway Knuckles — game core. Pure logic: no DOM, no canvas. Rendering and input live in the UI script. */
const HK = (() => {
'use strict';
const SEG = 200, RUMBLE = 3, ROADW = 2000, LANES = 3, FOV = 100, CAMH = 1000;
const camDepth = 1 / Math.tan((FOV / 2) * Math.PI / 180);
const playerZ = CAMH * camDepth;
const MAXS = SEG * 60;
const FINISH_SEG = 5;

const rng = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const lerp = (a, b, p) => a + (b - a) * p, clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeIn = (a, b, p) => a + (b - a) * p * p, easeInOut = (a, b, p) => a + (b - a) * ((-Math.cos(p * Math.PI) / 2) + 0.5);

/* ---------- content ---------- */
const STAGES = [
  { id: 'dust', name: 'Dust Bowl', blurb: 'Sunset two-lane through cactus country. Gentle bends, light traffic.',
    seed: 1987, len: 2500, curveMax: 3, flat: 0.4, hillMax: 35, traffic: 20, trucks: 0.15, oncoming: 0, prize: 1,
    scenery: [['cactus', 5, 1.25, 3.4], ['rock', 2, 1.3, 3.6], ['sign', 0.5, 1.55, 1.55], ['post', 2, 1.12, 1.12]], poles: 60 },
  { id: 'salt', name: 'Salt Flats', blurb: 'Straight, white and blinding. Heavy trucks and oncoming traffic.',
    seed: 31, len: 2800, curveMax: 2, flat: 0.7, hillMax: 15, traffic: 24, trucks: 0.4, oncoming: 0.3, prize: 1.4,
    scenery: [['saltrock', 3, 1.3, 4], ['sign', 0.6, 1.55, 1.55], ['post', 3, 1.12, 1.12]], poles: 40 },
  { id: 'coast', name: 'Coast Road', blurb: 'Cliff-top bends with the sea on your left. The guard rail bites.',
    seed: 77, len: 3000, curveMax: 4.5, flat: 0.45, hillMax: 40, traffic: 22, trucks: 0.2, oncoming: 0.3, prize: 1.9,
    scenery: [['palm', 4, 1.3, 3.2, 1], ['rock', 2, 1.3, 3, 1], ['sign', 0.5, 1.55, 1.55, 1], ['post', 2, 1.12, 1.12, 1]], rail: -1, water: -1 },
  { id: 'pine', name: 'Pine Pass', blurb: 'Steep climbs hide what is over the crest. Tight bends all the way.',
    seed: 409, len: 3200, curveMax: 5, flat: 0.25, hillMax: 65, traffic: 24, trucks: 0.3, oncoming: 0.35, prize: 2.5,
    scenery: [['pine', 7, 1.25, 3.5], ['rock', 2, 1.3, 3], ['sign', 0.4, 1.55, 1.55], ['post', 2, 1.12, 1.12]], poles: 70 },
  { id: 'night', name: 'Midnight Run', blurb: 'City outskirts after dark. Fast riders, busy road, no mercy.',
    seed: 2049, len: 3400, curveMax: 4, flat: 0.4, hillMax: 40, traffic: 32, trucks: 0.3, oncoming: 0.35, prize: 3.2,
    scenery: [['building', 2, 2.4, 4.2], ['sign', 0.7, 1.55, 1.55], ['post', 1.5, 1.12, 1.12]], lamps: 16 },
];
const HALF = { cactus: .09, rock: .2, saltrock: .16, sign: .26, post: .03, pole: .04, palm: .07, pine: .13, lamp: .03, rail: .06, building: .55 };
const LABEL = { cactus: 'cactus', rock: 'rock', saltrock: 'salt mound', sign: 'billboard', post: 'marker post', pole: 'telegraph pole', palm: 'palm tree', pine: 'pine tree', lamp: 'lamp post', building: 'building' };
const SIGNS = ["JOE'S DINER", 'MOTEL 2 KM', 'GAS · FOOD', 'NO SPEED LIMIT', 'LAST GAS 90 KM', 'DRIVE SAFE', 'TYRES & TOWING', 'ROADHOUSE', 'SLOW DOWN', 'LIVE BAIT'];

const DIFF = {
  rookie: { key: 'rookie', name: 'Rookie', desc: 'Slower rivals, softer hits, lighter traffic.', skill: 0.78, aggr: 0.35, cd: [1.9, 3.2], hit: 9, crashDur: 1.5, taken: 0.45, traffic: 0.6, capUp: 0.06, capDown: 0.28, ramp: 0.01, lead: [1200, -2000], avoid: 0.45, prize: 1, weapons: 1 },
  rider:  { key: 'rider',  name: 'Rider',  desc: 'A fair fight. Rivals push back.', skill: 0.84, aggr: 0.55, cd: [1.3, 2.5], hit: 11, crashDur: 1.8, taken: 0.7, traffic: 0.85, capUp: 0.1, capDown: 0.2, ramp: 0.014, lead: [1600, 300], avoid: 0.55, prize: 1.5, weapons: 2 },
  outlaw: { key: 'outlaw', name: 'Outlaw', desc: 'Fast, armed and mean. Upgrades recommended.', skill: 0.935, aggr: 0.75, cd: [0.9, 1.8], hit: 13, crashDur: 2.3, taken: 1.15, traffic: 1.1, capUp: 0.16, capDown: 0.08, ramp: 0.022, lead: [1800, 1500], avoid: 0.65, prize: 2.2, weapons: 3 },
};
const UPG = [
  { key: 'engine', name: 'Engine', desc: '+4% top speed per level', cost: [400, 900, 1700, 2800] },
  { key: 'tyres',  name: 'Tyres',  desc: 'Sharper steering, less drift in bends', cost: [300, 700, 1300, 2200] },
  { key: 'armor',  name: 'Leathers', desc: '+20 bike health and less damage taken', cost: [350, 800, 1500, 2400] },
  { key: 'nitro',  name: 'Nitro',  desc: 'Fills faster and burns longer', cost: [300, 750, 1400, 2300] },
];
const WEAPONS = { chain: { key: 'chain', name: 'Chain', mul: 1.6, reach: 0.56, uses: 8 }, club: { key: 'club', name: 'Bat', mul: 1.45, reach: 0.5, uses: 10 } };
const RIVALS = [
  { name: 'VEX',    bike: '#e0405a', jacket: '#2b2440', helmet: '#e0405a', stripe: '#f3ead8', line: 'Stay out of my mirrors.' },
  { name: 'MARLOW', bike: '#4fb3c4', jacket: '#1e3a44', helmet: '#4fb3c4', stripe: '#141018', line: 'I have never lost on this road. Not once.' },

      if (v !== countUp.shown) { countUp.shown = v; $('rCash').textContent = '+$' + v.toLocaleString(); if (Math.floor(countUp.t * 14) !== Math.floor((countUp.t - dt) * 14) && countUp.t < 1.2) SFX.click(); }
      if (countUp.t > 1.3) countUp = null;
    }
    if (AU.engGain && AU.a) {
      const S = HK.S, sp = S ? S.speed / MAXS : 0, on = mode === 'race' && save.sound;
      AU.engGain.gain.setTargetAtTime(on ? 0.035 + 0.025 * sp : 0, AU.a.currentTime, 0.05);
      AU.eng[0].frequency.setTargetAtTime(48 + 130 * sp + (S && S.boosting ? 40 : 0), AU.a.currentTime, 0.05);
      AU.eng[1].frequency.setTargetAtTime(24 + 65 * sp, AU.a.currentTime, 0.05);
      if (on && S && S.heat) {
        const pd = S.distance + playerZ;
        if (S.rivals.some(r => r.cop && r.state === 'ride' && Math.abs(r.dist - pd) < 4000) && (sirenT -= dt) <= 0) { sirenT = 0.42; sirenHi = !sirenHi; tone(sirenHi ? 960 : 720, 0.4, 'triangle', 0.035); }
      }
    }
  }
  requestAnimationFrame(frame);
}
showScreen('boot');
requestAnimationFrame(frame);
boot();
})();
